<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Portrait placeholder</title>
  <desc id="desc">Abstract blue portrait placeholder for Jean Cacheux</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#dcecf1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0e2d5c"/>
      <stop offset="1" stop-color="#50bdd3"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <circle cx="400" cy="330" r="145" fill="url(#accent)" opacity=".92"/>
  <path d="M160 900c20-220 130-340 240-340s220 120 240 340" fill="url(#accent)" opacity=".92"/>
  <path d="M90 120c210 60 420 20 620-40" fill="none" stroke="#ef334e" stroke-width="8" opacity=".7"/>
  <text x="400" y="960" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#6a7482">ADD PORTRAIT</text>
</svg>
